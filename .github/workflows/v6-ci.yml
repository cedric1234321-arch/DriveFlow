name: DriveFlow V6 CI

on:
  push:
    branches: [v6-development, v6-hotfix-import-planner, v6-hotfix-weather-forecast, v6-ux-compact-planner-heatmap, v6-live-review-round2, v6-review-build21]
  pull_request:
    branches: [main]

jobs:
  test-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check v6/driveflow-v6-core.js
          node --check v6/driveflow-v6-migration.js
          node --check v6/driveflow-v6-weather.js
          node --check v6/driveflow-v6-intelligence.js
          node --check v6/driveflow-v6-planner.js
          node --check v6/driveflow-v6-intelligence-policy.js
          node --check v6/driveflow-v6-backtest.js
          node --check v6/driveflow-v6-io.js
          node --check v6/driveflow-v6-backup-compat.js
          node --check v6/driveflow-v6-data.js
          node --check v6/driveflow-v6-persistence.js
          node --check v6/driveflow-v6-fuel.js
          node --check v6/driveflow-v6-data-integrity.js
          node --check v6/driveflow-v6-savings-compat.js
          node --check v6/driveflow-v6-weather-validation.js
          node --check v6/driveflow-v6-app.js
          node --check v6/driveflow-v6-ui-guards.js
          node --check v6/driveflow-v6-write-ui.js
          node --check v6/driveflow-v6-ios-file-picker.js
          node --check v6/driveflow-v6-planner-ui.js
          node --check v6/driveflow-v6-weather-forecast-ui.js
          node --check v6/driveflow-v6-classifier-ui.js
          node --check v6/driveflow-v6-analytics-ui.js
          node --check v6/driveflow-v6-fuel-ui.js
          node --check v6/driveflow-v6-ux-polish.js
          node --check v6/driveflow-v6-review-rules.js
          node --check v6/driveflow-v6-live-review.js
          node --check v6/driveflow-v6-build21.js
          node --check v6/driveflow-v6-sw.js
          node --check v6/test-driveflow-v6-migration.js
          node --check v6/test-driveflow-v6-rules.js
          node --check v6/test-driveflow-v6-review-rules.js
          node --check v6/test-driveflow-v6-io.js
          node --check v6/test-driveflow-v6-service-worker.js
          node --check v6/test-driveflow-v6-weather-memory.js
          python -m py_compile tools/build_montpellier_fuel_history.py
          python -m json.tool v6/fuel-history-montpellier.json >/dev/null
      - name: Business logic smoke tests
        run: node v6/test-driveflow-v6.js
      - name: Migration regression tests
        run: node v6/test-driveflow-v6-migration.js
      - name: Savings and URSSAF rule tests
        run: node v6/test-driveflow-v6-rules.js
      - name: Live review rule tests
        run: node v6/test-driveflow-v6-review-rules.js
      - name: IO and backup regression tests
        run: node v6/test-driveflow-v6-io.js
      - name: Persistence and data regression tests
        run: node v6/test-driveflow-v6-browserless.js
      - name: Service-worker isolation tests
        run: node v6/test-driveflow-v6-service-worker.js
      - name: Residual rain memory tests
        run: node v6/test-driveflow-v6-weather-memory.js
      - name: Verify V6 app references
        run: |
          grep -q 'driveflow-v6-app.js' v6/index.html
          grep -q 'driveflow-v6-planner.js' v6/index.html
          grep -q 'driveflow-v6-planner-ui.js' v6/index.html
          grep -q 'driveflow-v6-weather-forecast-ui.js' v6/index.html
          grep -q 'driveflow-v6-ux-polish.js' v6/index.html
          grep -q 'driveflow-v6-review-rules.js' v6/index.html
          grep -q 'driveflow-v6-live-review.js' v6/index.html
          grep -q 'driveflow-v6-build21.js' v6/index.html
          grep -q 'driveflow-v6-intelligence-policy.js' v6/index.html
          grep -q 'driveflow-v6-fuel.js' v6/index.html
          grep -q 'driveflow-v6-savings-compat.js' v6/index.html
          grep -q 'driveflow-v6-ui-guards.js' v6/index.html
          grep -q 'driveflow-v6-write-ui.js' v6/index.html
          grep -q 'driveflow-v6-ios-file-picker.js' v6/index.html
          grep -q 'driveflow-v6-backup-compat.js' v6/index.html
          grep -q 'driveflow-v6-classifier-ui.js' v6/index.html
          grep -q 'driveflow-v6-analytics-ui.js' v6/index.html
          grep -q 'driveflow-v6-fuel-ui.js' v6/index.html
          grep -q 'driveflow-v6-data.js' v6/index.html
          grep -q 'driveflow-v6-persistence.js' v6/index.html
          grep -q 'driveflow-v6-data-integrity.js' v6/index.html
          grep -q 'driveflow-v6-intelligence.js' v6/index.html
          grep -q 'driveflow-v6-backtest.js' v6/index.html
          grep -q 'driveflow-v6-weather-validation.js' v6/index.html
          grep -q 'driveflow-v6-light.css' v6/index.html